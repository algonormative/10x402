name = "tenx402-api"
main = "worker/worker.js"
compatibility_date = "2025-10-08"

# The Worker has NO production npm dependencies. The lint engine, the JSON
# Schema subset, the x402 envelopes and the CDP JWT are all in worker/*.js, so
# `wrangler deploy` needs nothing installed but wrangler itself. That is
# deliberate: the one thing this service sells is a correct reading of a spec,
# and a supply chain is a place for that reading to change without anyone
# deciding to change it.

# ------------------------------------------------------------------ routes
#
# THE DOMAIN IS NOT REGISTERED YET. 10x402.com is the intended home and nothing
# in this repo depends on it resolving — no test fetches it, the Worker never
# calls it, and it appears only as a string in generated copy and in envelope
# metadata. Registering it and adding the zone to this account is step 1 of the
# deploy runbook in README.md; until then these routes cannot be created and
# `wrangler deploy` will say so.
#
# WHY `/check*` AND NOT `/check`. Route pattern matching considers the ENTIRE
# request URL including the query string, and patterns may not contain query
# parameters — so the only way to match a URL that has one is to end the pattern
# in a wildcard. A bare `/check` would match `/check` and MISS `/check?x=1`.
# GET /check takes no parameters today, and the wildcard is here so that adding
# one later is not a silent outage.
#
# `/lint` is exact and `/lint/*` covers everything below it. VERIFIED WHEN THE
# SINGLE-CHECK ROUTES LANDED: `/lint/one`, `/lint/envelope` and
# `/lint/envelope/one` are all matched by the existing wildcard — `*` in a route
# pattern matches any number of characters INCLUDING `/` — so no route was added
# for them, and none should be. A test asserts every path in the catalogue is
# covered by a pattern here, so a fifth route that needed one could not ship
# unnoticed.

routes = [
  { pattern = "10x402.com/check*", zone_name = "10x402.com" },
  { pattern = "10x402.com/lint", zone_name = "10x402.com" },
  { pattern = "10x402.com/lint/*", zone_name = "10x402.com" },
  # /presence takes no query parameters today; the wildcard is the same
  # future-proofing as /check* — a parameter added later must not become a
  # silent outage.
  { pattern = "10x402.com/presence*", zone_name = "10x402.com" },
  # ONE PATTERN FOR THE WHOLE MONITORING WING, and it has to be a wildcard for a
  # reason the others do not have: `/monitor/{host}` is a DYNAMIC path, so there
  # is no finite set of exact patterns to write. `*` matches any number of
  # characters INCLUDING `/`, so this one covers the index (`/monitor`), the
  # three paid routes (`/monitor/verdict|history|receipt`), every host lookup,
  # and any query string on any of them. The catalogue-coverage test in
  # test/single-check.test.mjs checks the paid three against it.
  { pattern = "10x402.com/monitor*", zone_name = "10x402.com" },
  # THE MACHINE-READ SURFACES, served from code because the Pages static layer
  # rejects them for exactly the callers they exist for. Cloudflare Pages
  # applies its own Browser Integrity Check to every request that reaches the
  # Pages project — static assets AND Pages Functions — and answers 403 `error
  # code: 1010` to Python-stdlib user agents (Python-urllib/3.14,
  # python-requests), measured 2026-09-03 on both the custom domain and the
  # pages.dev twin, with zone BIC turned OFF and a zone WAF Skip rule in place
  # (both verified ineffective). Only paths owned by a Worker attached to the
  # ZONE bypass it — so a Python-stdlib buyer agent could pay a 402 here but
  # not read llms.txt. Bodies come from worker/surfaces.generated.js, written
  # by `node build.mjs` byte-identical to the dist/ copies, which stay in
  # place for the pages.dev twin and for browsers. Wildcards for the /check*
  # reason: patterns match the whole URL including the query string, and a
  # query parameter must not become a silent 403.
  { pattern = "10x402.com/llms.txt*", zone_name = "10x402.com" },
  { pattern = "10x402.com/openapi.json*", zone_name = "10x402.com" },
  { pattern = "10x402.com/skill.md*", zone_name = "10x402.com" },
  { pattern = "10x402.com/sitemap.xml*", zone_name = "10x402.com" },
  { pattern = "10x402.com/robots.txt*", zone_name = "10x402.com" },
  # The whole .well-known/ tree: only x402 exists today, and anything else
  # under it gets the Worker's JSON 404 instead of a Pages 403 to the callers
  # above. A second well-known file added later is served the moment the build
  # emits it — the coverage test in test/surfaces.test.mjs enforces that.
  { pattern = "10x402.com/.well-known/*", zone_name = "10x402.com" }
]

# The read surface that REMAINS on Pages: index.html, guides/, 404.html,
# fonts/ and samples/ — dist/ is a separate Cloudflare Pages project serving
# static assets with ZERO Functions. The machine surfaces used to live there
# too; the routes above moved them onto the Worker (see the note on why).
# KNOWN GAP, deliberately deferred: samples/ and guides/ still 403
# Python-stdlib UAs — they were left on Pages when the machine surfaces moved
# (2026-09-03); a follow-up decides whether the samples belong here too.

# ------------------------------------------------------------------ payment
#
# All of these are UNSET by default, and unset is a working state.
#
# [vars]
# PAYTO = "0x..."            # receiving address for USDC on Base. UNSET means
#                            # every paid call answers 429 instead of 402,
#                            # because there is nowhere to pay.
# PAYTO_SOLANA = "..."       # OPTIONAL. Base58 receiving address for USDC on
#                            # Solana — the second rail. UNSET = the rail is off
#                            # and every envelope is Base-only, byte for byte as
#                            # before. SET in [vars] below. See the note there.
# FACILITATOR_URL = "..."    # OPTIONAL override; defaults to the CDP facilitator
#                            # (https://api.cdp.coinbase.com/platform/v2/x402).
#                            # ONLY the test suite sets it, to reach a local mock.
# FREE_TIER_DAILY = "3"      # OPTIONAL. Free calls per caller per UTC day.
#                            # UNSET = 0 = OFF, which is the production default.
#
# ON FREE_TIER_DAILY, AND WHY IT SHOULD STAY OFF HERE IN PARTICULAR. This var is
# the ONLY runtime authority for the free tier, so setting it takes effect on
# the next request and GET /check reports it immediately without a rebuild.
# Turning it on costs discoverability: CDP Bazaar's prober calls an
# unauthenticated request expecting a 402, on an interval, and a free tier hands
# any fresh IP a 200 — which fails that probe and DELISTS an endpoint that was
# already indexed.
#
# On this service it costs one thing more. HTTP_FREE_TIER_200 is a check in this
# product's own catalogue: turning on a free tier here would make 10x402 fail
# the lint it sells. The self-lint invariant in test/self-lint.test.mjs runs
# against the production configuration for exactly that reason.
#
# The two CDP credentials are SECRETS, not vars — they never belong in this
# committed file. Set them once per environment:
#
#   npx wrangler secret put CDP_API_KEY_ID
#   npx wrangler secret put CDP_API_KEY_SECRET
#
# Without both, paid calls are still SERVED (availability-first) but carry
# `x-payment-verified: false` and `x-payment-error: facilitator-unconfigured`,
# and every one is recorded in `settlements`. A working state, and also a
# revenue-is-zero state.

# ------------------------------------------------------------------ the lint fetch
#
# LINT_UNSAFE_TARGETS — DO NOT SET THIS IN PRODUCTION. It relaxes the SSRF guard
# on POST /lint's outbound request (https-only, and the private/reserved address
# and private-name refusals) so the suite can point /lint at a mock target on
# 127.0.0.1. It is off unless the value is exactly "1". A deployment that sets
# it turns this service into an open proxy into whatever network it can reach.
#
# LINT_TIMEOUT_MS — OPTIONAL, default 10000, clamped to [200, 10000]. The suite
# lowers it so the timeout PATH can be proven in under a second instead of ten.
# Production leaves it alone.
#
# Neither is set here, on purpose. Both are documented so that finding one set
# somewhere is immediately legible as a mistake rather than as a feature.

# ------------------------------------------------------------------ the presence reads
#
# POST /presence reads four surfaces, all of them free and keyless, so this route
# needs NO configuration at all — a fresh deploy serves it with nothing set.
#
#   PRESENCE_BAZAAR_BASE  default https://api.cdp.coinbase.com
#   PRESENCE_SCAN_BASE    default https://www.x402scan.com
#   PRESENCE_CHAIN_BASE   default https://base.blockscout.com
#   PRESENCE_SOLANA_BASE  default https://api.mainnet-beta.solana.com
#
# All four are TEST SEAMS ONLY — the suite points them at mock registries on
# 127.0.0.1, which is how `npm test` proves the presence path without touching a
# live registry — and none is set here, exactly like LINT_UNSAFE_TARGETS above.
#
# PRESENCE_SOLANA_BASE IS THE WHOLE RPC ENDPOINT URL, not a host to hang a path
# off: JSON-RPC posts every method to the same address, so the var is used
# verbatim while the other three have a path appended.
#
# WHICH CHAIN IS READ is decided by the payTo's ADDRESS SHAPE and never by the
# declared network — the declaration is the thing under examination. A `0x`
# address goes to Blockscout, a base58 one to the Solana RPC, and anything else
# reports `unknown` rather than a claim about a chain nobody queried.

[vars]
# ------------------------------------------------------------------ the second rail
#
# PAYTO_SOLANA turns every 402 into a TWO-ENTRY offer: USDC on Base first, USDC
# on Solana second, same price, same atomic amount (both mints are 6 decimals).
# Unset, nothing changes — one entry, Base, exactly as before.
#
# This is a RECEIVE-ONLY address and its USDC associated token account already
# exists, so there is no per-payTo ATA work outstanding on this property. The
# address is public by construction (every settlement to it is a visible USDC
# transfer), which is why it belongs in a committed var and not in a secret.
#
# THE RAIL ALSO NEEDS THE CDP CREDENTIALS BELOW. Without them the Worker cannot
# make the authenticated GET /supported read that tells it which account will pay
# the Solana transaction fee, and it FAILS CLOSED — no Solana entry, a Base-only
# envelope, no error. Setting this var on a deployment with no CDP keys therefore
# changes nothing at all. The fee payer is never pinned: CDP draws them from a
# pool and rotates them between reads (see worker/x402.js § feePayer).
PAYTO_SOLANA = "6Cg4g7rXQApimMc9wVJGLLZfHsvbwGpGrUpGDgyJ2RaP"

# The house's own wallets, so the owner's own test buys read as a drill rather
# than as a sale. Any payer NOT listed here gets the loud third-party message —
# the event this channel exists for, which must never look like a test.
#
# NON-SECRET on purpose: these are public chain addresses, already visible on
# Base to anyone running the ledger queries in README § Reading the ledger.
# Comma-separated; compared lowercased. UNSET means every payer reads as a third
# party, which fails towards TOO LOUD — the right direction for a revenue alert.
#
# Two entries, one per rail:
#
#   0x632f…  the throwaway EVM buyer behind this rail's live settlements.
#   D7f9…    the house SOLANA buyer, a CDP server account. Estate-wide: the same
#            address goes into every property's HOUSE_PAYERS. It is a BUYER and
#            never a payTo.
#
# Base58 is case-SENSITIVE where a hex address is not — but isHousePayer()
# lowercases both sides before comparing, so the Solana address matches whatever
# case the facilitator reports it in.
HOUSE_PAYERS = "0x632ff2f904cc6ab6d741a42014c4c483f328e92f,D7f9EifwoMdfwozWDNLFhBGwecVhryc5fs2SxLK93M45"

# ------------------------------------------------------------------ alerts
#
# Owner-facing payment alerts: a Telegram ping and an email when money moves.
# They fire from inside ctx.waitUntil, AFTER the caller has its response, and
# each channel is independently try/caught — so a dead Telegram, a bad token or
# an unconfigured Email Routing zone costs a notification and NOTHING ELSE. A
# channel with no config is skipped before any network call, so UNSET IS A
# WORKING STATE.
#
# THREE SECRETS, none of which may ever appear in this committed file:
#
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   # from @BotFather
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put ALERT_EMAIL_TO       # the owner's personal address
#
# ALERT_EMAIL_TO is a SECRET rather than a var for a reason about this repo
# rather than about cryptography: it is public, and a personal inbox address
# committed to it is a spam magnet forever. It must ALSO be a VERIFIED Email
# Routing destination on the sending zone.
#
# TELEGRAM_API_BASE is an OPTIONAL var defaulting to https://api.telegram.org.
# Only the suite sets it, to reach a local mock. Deliberately not set here.

# ------------------------------------------------------------------ analytics
#
# PostHog, and it is the FUNNEL, not the ledger. `settlements` and `lints` stay
# the source of truth for anything about money or volume — they are written on
# the request path and survive PostHog being down for a week. What this answers
# is the question no table can: who knocked and where they stopped. A 402 nobody
# ever pays, an AI crawler that reads /check hourly and never buys, an indexer
# prober that quietly stopped calling — none of those write a row anywhere.
#
#   npx wrangler secret put POSTHOG_PROJECT_TOKEN   # phc_... from PostHog
#
# A SECRET RATHER THAN A VAR, and for the same reason ALERT_EMAIL_TO is: not
# cryptography, repo hygiene. A `phc_` project token is genuinely public — it
# ships in the HTML of every page on this domain — but this repo is public too,
# and a committed ingestion token is a spam target forever. Nothing is protected
# by putting it in the secret store; something is avoided.
#
# POSTHOG_HOST is an OPTIONAL var, default https://us.i.posthog.com. Set it only
# for EU cloud or a self-hosted instance. Deliberately not set here.
#
# UNSET IS A WORKING STATE, and the check happens before any network call: a
# deployment that never sets the token behaves exactly as if worker/analytics.js
# did not exist. The suite never sets it, which is why `npm test` makes no live
# PostHog call — analytics is off in every phase, by construction rather than by
# a mock.
#
# WHAT IT SENDS, and the boundary is worth reading before adding a property: one
# `$http_log` per request (method, path, status, user agent — so PostHog's own
# bot and AI-traffic classification can read it) plus at most one business event
# per paid call (quote issued / report served / call refused). NEVER the linted
# URL, the pasted envelope, the report, or the raw IP — the same line
# recordLintSafely draws, and `test/analytics.test.mjs` fails if it moves.

# The email channel's binding. UNRESTRICTED — deliberately no
# `destination_address` field, because that would put a personal inbox in a
# public repo. The recipient comes from the ALERT_EMAIL_TO secret instead, and
# Cloudflare still enforces the constraint that matters: it only delivers to a
# VERIFIED Email Routing destination.
#
# The Worker reads this binding defensively (`env.ALERT_EMAIL?.send`), so a
# deployment on an account without Email Routing has no email channel rather
# than a broken one.
[[send_email]]
name = "ALERT_EMAIL"

# ------------------------------------------------------------------ the Parallax crons
#
# The monitoring wing's substrate, and the ONLY scheduled work this Worker does.
# Both times are UTC (Cloudflare crons have no other timezone) and both strings
# are duplicated as constants in worker/monitor.js, which is how `scheduled`
# dispatches — a test reads this file and fails if the two drift apart.
#
#   17 */6 * * *  CAPTURE (00:17, 06:17, 12:17, 18:17 UTC). Read agenteconomy.report/s/ratings.json, apistrust.com
#                and the full CDP Bazaar catalogue; join per host; write the
#                day's monitor_readings and the capture half of monitor_days.
#   47 */6 * * *  PROBE (thirty minutes after each capture). Derive the day's roster from those readings and ask each
#                host's most-recently-called resource what it does — on the verb
#                it DECLARED and on GET. Writes monitor_probes and the probe half
#                of monitor_days. Never sends X-PAYMENT. Never pays.
#
# THIRTY MINUTES APART ON PURPOSE: the probe reads what the capture wrote, and
# the capture's slowest part is ~16 sequential catalogue pages.
#
# SUBREQUEST ARITHMETIC, because the ceiling is real and the second cron scales
# with a number an operator can change. A Worker on the paid plan gets 1000
# subrequests per invocation.
#
#   capture ≈ 1 (ratings.json) + 1 (apistrust) + ~16 catalogue pages ≈ 18.
#             The catalogue was 14,732 resources at limit=1000; the pager's own
#             bound is 64 pages, so even a runaway capture stays under 70.
#   probe   ≤ MONITOR_PROBE_CAP × 2 + margin. Two requests per host (declared
#             verb, then GET) and ONE when the declared verb is already GET. At
#             the default cap of 400 that is at most 800, comfortably inside
#             1000 — which is why the default is 400 and not 500.
#
# MONITOR_PROBE_CAP is an OPTIONAL var, default 400, clamped to 900 in code so a
# typo cannot ask for a ceiling breach. MONITOR_AE_BASE, MONITOR_AT_BASE and
# MONITOR_TIMEOUT_MS are the test seams (mock instruments on 127.0.0.1) and are
# deliberately not set here, exactly like the PRESENCE_*_BASE vars.
# MONITOR_HOUSE_HOSTS is a comma list of hosts that are probed whatever else is
# true; 10x402.com is always in it and needs no config.
#
# ON THE FREE PLAN these crons still fire, but the subrequest ceiling is 50 —
# the capture would die mid-catalogue and the probe after ~25 hosts. This wing
# assumes the paid plan, which this account is already on for the request path.
[triggers]
crons = ["17 */6 * * *", "47 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tenx402"
# Placeholder — local dev only. REPLACE at deploy with the id printed by
# `wrangler d1 create tenx402`.
database_id = "421ff9ba-98ff-418a-a6ba-a4d54719e744"
